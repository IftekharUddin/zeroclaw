name: Desktop App Check

# Compiles + lints `zeroclaw-desktop` (the Tauri app) on macOS, Linux, and
# Windows. The workspace-wide cross-platform-clippy job intentionally
# `--exclude`s this crate (it needs the platform GUI toolchains), so without
# this job the desktop app is never type-checked off the author's machine.
#
# Kept off the default required PR gate to avoid adding macOS/Windows latency
# to every PR — it runs on demand, weekly, and on PRs that actually touch the
# desktop app.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 10 * * 1"
  pull_request:
    paths:
      - "apps/tauri/**"
      - ".github/workflows/desktop-check.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: zeroclaw-desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Tauri v2 needs WebKitGTK + libsoup + GTK on Linux.
      - name: Install Linux desktop toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: 1.98.0
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # The desktop app points its WebView at the running gateway; a placeholder
      # dist keeps the workspace `embedded-web` path happy during compile.
      - name: Ensure web/dist placeholder exists
        shell: bash
        run: mkdir -p web/dist && touch web/dist/.gitkeep

      - name: Clippy (zeroclaw-desktop)
        run: cargo clippy -p zeroclaw-desktop --all-targets -- -D warnings

      - name: Native RPC endpoint derivation
        if: runner.os == 'Windows' && !cancelled()
        run: cargo test --locked -p zeroclaw-api --lib rpc_endpoint

      - name: Native RPC client pipe migration
        if: runner.os == 'Windows' && !cancelled()
        run: cargo test --locked -p zeroclaw-rpc-client --lib local_pipe_

      - name: Native ZeroCode endpoint selection
        if: runner.os == 'Windows' && !cancelled()
        run: cargo test --locked -p zerocode --bin zerocode client::endpoint_tests

      - name: Native ZeroCode process refusal
        if: runner.os == 'Windows' && !cancelled()
        run: cargo test --locked -p zerocode --test local_endpoint_migration

      - name: Native released-daemon migration
        if: runner.os == 'Windows' && !cancelled()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixtureRoot = Join-Path $env:RUNNER_TEMP ('zeroclaw-release-' + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $fixtureRoot | Out-Null
          try {
            $archive = Join-Path $fixtureRoot 'release.zip'
            $expectedDigest = '46ede57760dfccca71ed94f135e149b103dff12a76a63fd8d13c2a5fe097bca7'
            Invoke-WebRequest -Uri 'https://github.com/zeroclaw-labs/zeroclaw/releases/download/v0.8.7/zeroclaw-x86_64-pc-windows-msvc.zip' -OutFile $archive
            $actualDigest = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualDigest -ne $expectedDigest) { throw 'Released archive checksum mismatch' }
            Write-Output "Verified v0.8.7 archive SHA256: $actualDigest"
            $unpacked = Join-Path $fixtureRoot 'unpacked'
            Expand-Archive -Path $archive -DestinationPath $unpacked
            $binaries = @(Get-ChildItem -Path $unpacked -Recurse -File -Filter 'zeroclaw.exe')
            if ($binaries.Count -ne 1) { throw 'Expected exactly one released zeroclaw.exe' }
            $env:ZEROCLAW_LEGACY_DAEMON_EXE = $binaries[0].FullName
            $env:ZEROCLAW_LEGACY_RELEASE_SHA256 = $actualDigest
            cargo test --locked -p zeroclaw-rpc-client --test released_windows_daemon -- --nocapture
            if ($LASTEXITCODE -ne 0) { throw 'Released daemon compatibility tests failed' }
          } finally {
            Remove-Item Env:ZEROCLAW_LEGACY_DAEMON_EXE -ErrorAction SilentlyContinue
            Remove-Item Env:ZEROCLAW_LEGACY_RELEASE_SHA256 -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $fixtureRoot -Recurse -Force -ErrorAction SilentlyContinue
          }
